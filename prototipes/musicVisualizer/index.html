<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SONUS — Visualizador de Música</title>
    <link
      rel="shortcut icon"
      href="../../assets/logoMusciVisualizer.png"
      type="image/x-icon"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #020408;
        --panel: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --accent1: #00ffe0;
        --accent2: #ff2d78;
        --accent3: #ffe600;
        --text: #e8eaf0;
        --muted: rgba(232, 234, 240, 0.4);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Space Mono", monospace;
        overflow: hidden;
        user-select: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
        opacity: 0.5;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      }

      /* Beat flash */
      #beat-flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 255, 224, 0.18) 0%,
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.09s ease-out;
      }
      #beat-flash.pop {
        opacity: 1;
        transition: none;
      }

      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }

      /* HEADER */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
        position: relative;
        z-index: 10;
        background: linear-gradient(
          180deg,
          rgba(2, 4, 8, 0.98) 0%,
          transparent 100%
        );
        transition:
          transform 0.4s ease,
          opacity 0.4s ease;
      }
      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 2rem;
        letter-spacing: 0.18em;
        background: linear-gradient(90deg, var(--accent1), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 16px rgba(0, 255, 224, 0.5));
      }
      .logo span {
        -webkit-text-fill-color: var(--accent3);
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .status-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        transition: all 0.3s;
      }
      .status-dot.active {
        background: var(--accent1);
        box-shadow:
          0 0 10px var(--accent1),
          0 0 20px var(--accent1);
        animation: pdot 1.4s ease-in-out infinite;
      }
      @keyframes pdot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      #freq-readout {
        font-size: 0.62rem;
        color: var(--accent1);
      }
      #bpm-readout {
        font-size: 0.62rem;
        color: var(--accent2);
      }

      #fs-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #fs-btn:hover {
        border-color: var(--accent1);
        color: var(--accent1);
        box-shadow: 0 0 12px rgba(0, 255, 224, 0.15);
      }

      /* CANVAS */
      #canvas-wrap {
        position: relative;
        overflow: hidden;
      }
      #viz-canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      #three-canvas {
        display: none;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      #canvas-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(2, 4, 8, 0.82) 100%
        );
      }

      @keyframes scan {
        0% {
          transform: translateY(-100%);
        }
        100% {
          transform: translateY(100vh);
        }
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        pointer-events: none;
        z-index: 2;
        background: linear-gradient(
          transparent,
          rgba(0, 255, 224, 0.03),
          transparent
        );
        animation: scan 8s linear infinite;
      }

      #empty-state {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: opacity 0.5s;
      }
      #empty-state.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .empty-icon {
        font-size: 3.5rem;
        opacity: 0.1;
      }
      .empty-text {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.3rem;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .empty-sub {
        font-size: 0.62rem;
        color: rgba(232, 234, 240, 0.18);
        letter-spacing: 0.1em;
      }

      #drop-hint {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 4, 8, 0.92);
        border: 2px dashed var(--accent1);
        font-family: "Bebas Neue", sans-serif;
        font-size: 2.8rem;
        letter-spacing: 0.2em;
        color: var(--accent1);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #drop-hint.show {
        opacity: 1;
        pointer-events: all;
      }

      #mode-btns {
        position: absolute;
        top: 18px;
        right: 24px;
        z-index: 20;
        display: flex;
        gap: 6px;
      }
      .mode-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .mode-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .mode-btn.active {
        background: rgba(0, 255, 224, 0.08);
        border-color: var(--accent1);
        color: var(--accent1);
        box-shadow: 0 0 10px rgba(0, 255, 224, 0.18);
      }

      /* Animated track title */
      #track-info {
        position: absolute;
        bottom: 24px;
        left: 28px;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.5s;
      }
      #track-info.visible {
        opacity: 1;
      }
      #track-name {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.7rem;
        letter-spacing: 0.1em;
        color: #fff;
        text-shadow: 0 0 30px rgba(0, 255, 224, 0.6);
        display: inline-block;
        transform-origin: left center;
      }
      #track-sub {
        font-size: 0.62rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        margin-top: 4px;
      }

      /* CONTROLS */
      #controls {
        border-top: 1px solid var(--border);
        background: rgba(2, 4, 8, 0.94);
        backdrop-filter: blur(10px);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        gap: 22px;
        position: relative;
        z-index: 10;
        transition:
          transform 0.4s ease,
          opacity 0.4s ease;
      }
      .ctrl-btn {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 18px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.22s;
        white-space: nowrap;
      }
      .ctrl-btn:hover {
        border-color: var(--accent1);
        color: var(--accent1);
        box-shadow: 0 0 14px rgba(0, 255, 224, 0.13);
      }
      #file-input {
        display: none;
      }

      .progress-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.58rem;
        color: var(--muted);
      }
      #progress-bar-wrap {
        width: 100%;
        height: 12px;
        display: flex;
        align-items: center;
        cursor: pointer;
        position: relative;
        padding: 4px 0;
        box-sizing: border-box;
      }
      #progress-bar-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        position: relative;
      }
      #progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent1), var(--accent2));
        border-radius: 2px;
        position: relative;
        transition: width 0.08s linear;
      }
      #progress-bar::after {
        content: "";
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 8px var(--accent1);
        opacity: 0;
        transition: opacity 0.2s;
      }
      #progress-bar-wrap:hover #progress-bar::after,
      #progress-bar-wrap.dragging #progress-bar::after {
        opacity: 1;
      }
      #progress-bar-wrap.dragging {
        cursor: grabbing;
      }
      #progress-bar-wrap.dragging #progress-bar {
        transition: none;
      }

      .vol-wrap {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 110px;
      }
      .vol-label {
        font-size: 0.58rem;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 72px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent1);
        box-shadow: 0 0 8px var(--accent1);
        cursor: pointer;
      }

      .color-swatches {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .swatch:hover {
        transform: scale(1.25);
      }
      .swatch.active {
        border-color: #fff;
      }
      .swatch.s1 {
        background: linear-gradient(135deg, #00ffe0, #ff2d78);
      }
      .swatch.s2 {
        background: linear-gradient(135deg, #ffe600, #ff6b00);
      }
      .swatch.s3 {
        background: linear-gradient(135deg, #7c3aff, #00c6ff);
      }
      .swatch.s4 {
        background: linear-gradient(135deg, #39ff14, #00ffe0);
      }

      /* TRANSPORT BUTTONS */
      .transport-btns {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .transport-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        width: 34px;
        height: 34px;
        border-radius: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .transport-btn:hover {
        border-color: var(--accent1);
        color: var(--accent1);
        box-shadow: 0 0 10px rgba(0, 255, 224, 0.15);
      }
      .transport-btn.active {
        border-color: var(--accent1);
        color: var(--accent1);
        background: rgba(0, 255, 224, 0.07);
      }
      .transport-btn.stop-btn:hover {
        border-color: var(--accent2);
        color: var(--accent2);
        box-shadow: 0 0 10px rgba(255, 45, 120, 0.15);
      }

      /* PLAYLIST */
      #playlist-panel {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        background: rgba(2, 4, 8, 0.97);
        border-left: 1px solid var(--border);
        z-index: 300;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        backdrop-filter: blur(16px);
      }
      #playlist-panel.open {
        transform: translateX(0);
      }
      .playlist-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .playlist-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.1rem;
        letter-spacing: 0.18em;
        color: var(--accent1);
      }
      .playlist-close {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 4px;
        transition: color 0.2s;
      }
      .playlist-close:hover {
        color: var(--accent2);
      }
      .playlist-actions {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .pl-btn {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 7px 10px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .pl-btn:hover {
        border-color: var(--accent1);
        color: var(--accent1);
      }
      #playlist-drop-zone {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      #playlist-drop-zone::-webkit-scrollbar {
        width: 4px;
      }
      #playlist-drop-zone::-webkit-scrollbar-track {
        background: transparent;
      }
      #playlist-drop-zone::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      #playlist-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 10px;
        color: var(--muted);
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        padding: 20px;
      }
      #playlist-empty svg {
        opacity: 0.2;
      }

      .pl-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 2px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.18s;
        margin-bottom: 3px;
        position: relative;
      }
      .pl-item:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border);
      }
      .pl-item.playing {
        background: rgba(0, 255, 224, 0.06);
        border-color: rgba(0, 255, 224, 0.25);
      }
      .pl-item.dragging {
        opacity: 0.4;
        border-color: var(--accent1);
      }
      .pl-item.drag-over {
        border-top: 2px solid var(--accent1);
      }
      .pl-drag-handle {
        color: var(--muted);
        opacity: 0.4;
        cursor: grab;
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      .pl-drag-handle:active {
        cursor: grabbing;
      }
      .pl-num {
        font-size: 0.55rem;
        color: var(--muted);
        width: 18px;
        text-align: right;
        flex-shrink: 0;
        letter-spacing: 0.05em;
      }
      .pl-item.playing .pl-num {
        color: var(--accent1);
      }
      .pl-name {
        flex: 1;
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: uppercase;
      }
      .pl-item.playing .pl-name {
        color: var(--accent1);
      }
      .pl-remove {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        opacity: 0;
        padding: 2px;
        line-height: 1;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .pl-item:hover .pl-remove {
        opacity: 1;
      }
      .pl-remove:hover {
        color: var(--accent2);
      }

      .playlist-footer {
        padding: 8px 16px;
        border-top: 1px solid var(--border);
        font-size: 0.55rem;
        color: var(--muted);
        letter-spacing: 0.1em;
        flex-shrink: 0;
      }

      /* PLAYLIST TOGGLE BTN */
      #playlist-toggle-btn {
        position: relative;
      }
      #pl-count-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--accent1);
        color: var(--bg);
        font-size: 0.48rem;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        display: none;
      }

      /* Fullscreen */
      body.fullscreen header {
        transform: translateY(-110%);
        opacity: 0;
        pointer-events: none;
      }
      body.fullscreen #app {
        grid-template-rows: 0 1fr auto;
      }
      body.fullscreen #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        transform: translateY(100%);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
        z-index: 100;
      }
      body.fullscreen.controls-visible #controls {
        transform: translateY(0);
        opacity: 1;
        pointer-events: all;
      }
      #fs-hint {
        position: fixed;
        bottom: 16px;
        right: 18px;
        z-index: 200;
        font-size: 0.56rem;
        color: rgba(255, 255, 255, 0.15);
        letter-spacing: 0.1em;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      body.fullscreen #fs-hint {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- PLAYLIST PANEL -->
    <div id="playlist-panel">
      <div class="playlist-header">
        <span class="playlist-title">PLAYLIST</span>
        <button class="playlist-close" id="playlist-close-btn">✕</button>
      </div>
      <div class="playlist-actions">
        <label class="pl-btn" for="playlist-file-input">
          <svg
            width="11"
            height="11"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          AGREGAR
        </label>
        <input
          type="file"
          id="playlist-file-input"
          accept="audio/*"
          multiple
          style="display: none"
        />
        <button class="pl-btn" id="pl-clear-btn">
          <svg
            width="11"
            height="11"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
          LIMPIAR
        </button>
      </div>
      <div id="playlist-drop-zone">
        <div id="playlist-empty">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
          <span>Arrastrá canciones aquí<br />o usá AGREGAR</span>
        </div>
      </div>
      <div class="playlist-footer" id="playlist-footer">0 canciones</div>
    </div>

    <div id="beat-flash"></div>
    <div id="fs-hint">F · ESC — salir pantalla completa</div>

    <div id="app">
      <header>
        <div class="logo">SON<span>U</span>S</div>
        <div class="header-right">
          <div class="status-bar">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">INACTIVO</span>
            <span id="freq-readout">— Hz</span>
            <span id="bpm-readout">— BPM</span>
          </div>
          <button id="fs-btn">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
            PANTALLA COMPLETA
          </button>
        </div>
      </header>

      <div id="canvas-wrap">
        <div class="scanline"></div>
        <div id="empty-state">
          <div class="empty-icon">◈</div>
          <div class="empty-text">Carga un archivo de audio</div>
          <div class="empty-sub">
            Arrastra aquí · botón ARCHIVO · o MICRÓFONO
          </div>
        </div>
        <div id="drop-hint">◈ SUELTA EL ARCHIVO</div>
        <canvas id="viz-canvas"></canvas>
        <canvas id="three-canvas"></canvas>
        <div id="mode-btns">
          <button class="mode-btn active" data-mode="bars">BARRAS</button>
          <button class="mode-btn" data-mode="wave">ONDA</button>
          <button class="mode-btn" data-mode="radial">RADIAL</button>
          <button class="mode-btn" data-mode="tunnel">TÚNEL</button>
          <button class="mode-btn" data-mode="3d">3D</button>
        </div>
        <div id="track-info">
          <div id="track-name">—</div>
          <div id="track-sub">SONUS VISUALIZER</div>
        </div>
      </div>

      <div id="controls">
        <label class="ctrl-btn" for="file-input">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          ARCHIVO
        </label>
        <input type="file" id="file-input" accept="audio/*" />

        <button class="ctrl-btn" id="mic-btn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          MICRÓFONO
        </button>

        <!-- TRANSPORT -->
        <div class="transport-btns">
          <button class="transport-btn" id="prev-btn" title="Anterior">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon points="19 20 9 12 19 4 19 20" />
              <line x1="5" y1="19" x2="5" y2="5" />
            </svg>
          </button>
          <button
            class="transport-btn"
            id="play-pause-btn"
            title="Play / Pause"
          >
            <svg
              id="pp-icon"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
          <button class="transport-btn stop-btn" id="stop-btn" title="Stop">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            </svg>
          </button>
          <button class="transport-btn" id="next-btn" title="Siguiente">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </button>
        </div>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="time-current">0:00</span><span id="time-total">0:00</span>
          </div>
          <div id="progress-bar-wrap">
            <div id="progress-bar-track"><div id="progress-bar"></div></div>
          </div>
        </div>

        <div class="vol-wrap">
          <span class="vol-label">VOL</span>
          <input
            type="range"
            id="vol-slider"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
        </div>

        <div class="color-swatches">
          <div class="swatch s1 active" data-scheme="0"></div>
          <div class="swatch s2" data-scheme="1"></div>
          <div class="swatch s3" data-scheme="2"></div>
          <div class="swatch s4" data-scheme="3"></div>
        </div>

        <!-- Playlist toggle -->
        <button
          class="ctrl-btn"
          id="playlist-toggle-btn"
          style="position: relative"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
          PLAYLIST
          <span id="pl-count-badge"></span>
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // ═══════════════════════════════════════════════
      //  SONUS — Real-time Music Visualizer
      // ═══════════════════════════════════════════════

      const canvas = document.getElementById("viz-canvas");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("canvas-wrap");
      const threeCanvas = document.getElementById("three-canvas");
      const flashEl = document.getElementById("beat-flash");

      const SCHEMES = [
        { a: "#00ffe0", b: "#ff2d78", c: "#ffe600", bg: "#020408" },
        { a: "#ffe600", b: "#ff6b00", c: "#ff2d78", bg: "#080400" },
        { a: "#7c3aff", b: "#00c6ff", c: "#ff2d78", bg: "#02040a" },
        { a: "#39ff14", b: "#00ffe0", c: "#ffe600", bg: "#010802" },
      ];
      let colorScheme = SCHEMES[0];

      let audioCtx, analyser, source, gainNode, mediaStream;
      let dataArray, bufferLength;
      let isActive = false,
        mode = "bars";
      let audioEl = null,
        animId = null;
      let bpmSamples = [],
        lastBeat = 0,
        beatEnergy = 0;
      let particles = [];
      let titleBounce = 1;
      let threeRenderer, threeScene, threeCamera, threeAnimId;

      // ─── RESIZE ───
      function resize() {
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        if (threeRenderer) {
          threeRenderer.setSize(wrap.clientWidth, wrap.clientHeight);
          threeCamera.aspect = wrap.clientWidth / wrap.clientHeight;
          threeCamera.updateProjectionMatrix();
        }
      }
      window.addEventListener("resize", resize);
      resize();

      // ─── AUDIO ───
      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        gainNode = audioCtx.createGain();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.8;
        gainNode.connect(audioCtx.destination);
        analyser.connect(gainNode);
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
      }
      function connectSource(src) {
        if (source) {
          try {
            source.disconnect();
          } catch (e) {}
        }
        source = src;
        source.connect(analyser);
      }

      // ─── FILE (handled via playlist above) ───
      function loadFile(file) {
        addToPlaylist(file);
        if (!isActive) playIndex(playlist.length - 1);
      }
      function setupProgress() {
        audioEl.addEventListener("timeupdate", () => {
          if (isScrubbing) return; // don't fight the drag
          const p = (audioEl.currentTime / audioEl.duration) * 100 || 0;
          document.getElementById("progress-bar").style.width = p + "%";
          document.getElementById("time-current").textContent = fmt(
            audioEl.currentTime,
          );
          document.getElementById("time-total").textContent = fmt(
            audioEl.duration,
          );
        });
      }

      // ─── SCRUB (drag on progress bar) ───
      let isScrubbing = false;

      function scrubPosition(e, bar) {
        const r = bar.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
      }

      function initScrub() {
        const wrap = document.getElementById("progress-bar-wrap");
        const bar = document.getElementById("progress-bar");

        function startScrub(e) {
          if (!audioEl || !audioEl.duration) return;
          isScrubbing = true;
          wrap.classList.add("dragging");
          bar.style.transition = "none";
          moveScrub(e);
        }

        function moveScrub(e) {
          if (!isScrubbing || !audioEl || !audioEl.duration) return;
          e.preventDefault();
          const ratio = scrubPosition(e, wrap);
          bar.style.width = ratio * 100 + "%";
          document.getElementById("time-current").textContent = fmt(
            audioEl.duration * ratio,
          );
        }

        function endScrub(e) {
          if (!isScrubbing) return;
          isScrubbing = false;
          wrap.classList.remove("dragging");
          bar.style.transition = "";
          if (audioEl && audioEl.duration) {
            const ratio = scrubPosition(
              e.changedTouches ? { clientX: e.changedTouches[0].clientX } : e,
              wrap,
            );
            audioEl.currentTime = audioEl.duration * ratio;
          }
        }

        // Mouse
        wrap.addEventListener("mousedown", startScrub);
        window.addEventListener("mousemove", moveScrub);
        window.addEventListener("mouseup", endScrub);

        // Touch
        wrap.addEventListener("touchstart", startScrub, { passive: false });
        window.addEventListener("touchmove", moveScrub, { passive: false });
        window.addEventListener("touchend", endScrub);
      }
      initScrub();

      function fmt(s) {
        if (!s || isNaN(s)) return "0:00";
        return `${Math.floor(s / 60)}:${Math.floor(s % 60)
          .toString()
          .padStart(2, "0")}`;
      }

      // ─── MIC ───
      let micActive = false;
      document.getElementById("mic-btn").addEventListener("click", async () => {
        if (micActive) {
          stopMic();
          resetUI();
          return;
        }
        try {
          initAudio();
          if (audioEl) audioEl.pause();
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });
          connectSource(audioCtx.createMediaStreamSource(mediaStream));
          micActive = true;
          setActive(true);
          document.getElementById("mic-btn").style.cssText +=
            ";border-color:var(--accent2);color:var(--accent2)";
          setTrackName("MICRÓFONO EN VIVO");
          document.getElementById("track-info").classList.add("visible");
          document.getElementById("empty-state").classList.add("hidden");
          startDraw();
        } catch (e) {
          alert("Micrófono no disponible: " + e.message);
        }
      });
      function stopMic() {
        if (micActive && mediaStream) {
          mediaStream.getTracks().forEach((t) => t.stop());
          mediaStream = null;
        }
        micActive = false;
        document.getElementById("mic-btn").style.borderColor = "";
        document.getElementById("mic-btn").style.color = "";
      }

      // ─── RESET ───
      function resetUI() {
        stopMic();
        setActive(false);
        isPlaying = false;
        updatePlayPauseIcon();
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
        if (threeAnimId) {
          cancelAnimationFrame(threeAnimId);
          threeAnimId = null;
        }
        document.getElementById("track-info").classList.remove("visible");
        document.getElementById("empty-state").classList.remove("hidden");
        document.getElementById("track-name").textContent = "—";
        document.getElementById("progress-bar").style.width = "0%";
        document.getElementById("time-current").textContent = "0:00";
        document.getElementById("time-total").textContent = "0:00";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        threeCanvas.style.display = "none";
        canvas.style.display = "block";
      }
      function setActive(v) {
        isActive = v;
        document.getElementById("status-dot").classList.toggle("active", v);
        document.getElementById("status-text").textContent = v
          ? "ACTIVO"
          : "INACTIVO";
      }

      // ─── VOL ───
      document.getElementById("vol-slider").addEventListener("input", (e) => {
        if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
        if (audioEl) audioEl.volume = parseFloat(e.target.value);
      });

      // ─── MODES ───
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".mode-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          if (mode === "3d") {
            canvas.style.display = "none";
            threeCanvas.style.display = "block";
            initThree();
            if (isActive) {
              if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
              }
              startThreeDraw();
            }
          } else {
            threeCanvas.style.display = "none";
            canvas.style.display = "block";
            if (threeAnimId) {
              cancelAnimationFrame(threeAnimId);
              threeAnimId = null;
            }
            if (isActive) startDraw();
          }
        });
      });

      // ─── COLORS ───
      document.querySelectorAll(".swatch").forEach((sw) => {
        sw.addEventListener("click", () => {
          document
            .querySelectorAll(".swatch")
            .forEach((s) => s.classList.remove("active"));
          sw.classList.add("active");
          colorScheme = SCHEMES[parseInt(sw.dataset.scheme)];
          updateThreeColors();
        });
      });

      // ─── DRAG & DROP (canvas area) ───
      document.body.addEventListener("dragover", (e) => {
        e.preventDefault();
        document.getElementById("drop-hint").classList.add("show");
      });
      document.body.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget || e.relatedTarget === document.body)
          document.getElementById("drop-hint").classList.remove("show");
      });
      document.body.addEventListener("drop", (e) => {
        e.preventDefault();
        document.getElementById("drop-hint").classList.remove("show");
        const files = Array.from(e.dataTransfer.files).filter((f) =>
          f.type.startsWith("audio/"),
        );
        if (files.length === 0) return;
        if (files.length === 1) {
          // If playlist is empty, just load directly
          if (playlist.length === 0) {
            loadFile(files[0]);
            return;
          }
        }
        // Add all to playlist
        files.forEach((f) => addToPlaylist(f));
        // If nothing playing, start first dropped
        if (!isActive) playIndex(playlist.length - files.length);
      });

      // ─── PLAYLIST STATE ───
      let playlist = []; // [{file, name, url}]
      let currentIndex = -1;
      let isPlaying = false;

      function addToPlaylist(file) {
        const url = URL.createObjectURL(file);
        const name = file.name.replace(/\.[^.]+$/, "").toUpperCase();
        playlist.push({ file, name, url });
        renderPlaylist();
      }

      function renderPlaylist() {
        const zone = document.getElementById("playlist-drop-zone");
        const empty = document.getElementById("playlist-empty");
        const footer = document.getElementById("playlist-footer");
        const badge = document.getElementById("pl-count-badge");

        empty.style.display = playlist.length === 0 ? "flex" : "none";
        footer.textContent = `${playlist.length} canción${playlist.length !== 1 ? "es" : ""}`;

        if (playlist.length > 0) {
          badge.style.display = "flex";
          badge.textContent = playlist.length > 99 ? "99+" : playlist.length;
        } else {
          badge.style.display = "none";
        }

        // Remove existing items
        zone.querySelectorAll(".pl-item").forEach((el) => el.remove());

        playlist.forEach((track, idx) => {
          const item = document.createElement("div");
          item.className = "pl-item" + (idx === currentIndex ? " playing" : "");
          item.dataset.idx = idx;
          item.draggable = true;

          item.innerHTML = `
            <div class="pl-drag-handle">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
            </div>
            <span class="pl-num">${String(idx + 1).padStart(2, "0")}</span>
            <span class="pl-name" title="${track.name}">${track.name}</span>
            <button class="pl-remove" data-idx="${idx}" title="Eliminar">✕</button>
          `;

          // Click to play
          item.addEventListener("click", (e) => {
            if (
              e.target.classList.contains("pl-remove") ||
              e.target.closest(".pl-drag-handle")
            )
              return;
            playIndex(idx);
          });

          // Remove button
          item.querySelector(".pl-remove").addEventListener("click", (e) => {
            e.stopPropagation();
            removeFromPlaylist(parseInt(e.target.dataset.idx));
          });

          // Drag events for reorder
          item.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", idx);
            e.dataTransfer.effectAllowed = "move";
            setTimeout(() => item.classList.add("dragging"), 0);
          });
          item.addEventListener("dragend", () =>
            item.classList.remove("dragging"),
          );
          item.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            zone
              .querySelectorAll(".pl-item")
              .forEach((el) => el.classList.remove("drag-over"));
            item.classList.add("drag-over");
          });
          item.addEventListener("dragleave", () =>
            item.classList.remove("drag-over"),
          );
          item.addEventListener("drop", (e) => {
            e.preventDefault();
            e.stopPropagation();
            item.classList.remove("drag-over");
            const fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
            const toIdx = parseInt(item.dataset.idx);
            if (fromIdx === toIdx) return;
            const moved = playlist.splice(fromIdx, 1)[0];
            playlist.splice(toIdx, 0, moved);
            // Update currentIndex
            if (currentIndex === fromIdx) currentIndex = toIdx;
            else if (fromIdx < currentIndex && toIdx >= currentIndex)
              currentIndex--;
            else if (fromIdx > currentIndex && toIdx <= currentIndex)
              currentIndex++;
            renderPlaylist();
          });

          zone.appendChild(item);
        });
      }

      function removeFromPlaylist(idx) {
        const removed = playlist.splice(idx, 1)[0];
        if (currentIndex === idx) {
          if (audioEl) {
            audioEl.pause();
            audioEl.src = "";
          }
          resetUI();
          currentIndex = -1;
          if (playlist.length > 0)
            playIndex(Math.min(idx, playlist.length - 1));
        } else if (currentIndex > idx) {
          currentIndex--;
        }
        setTimeout(() => URL.revokeObjectURL(removed.url), 5000);
        renderPlaylist();
      }

      function playIndex(idx) {
        if (idx < 0 || idx >= playlist.length) return;
        currentIndex = idx;
        const track = playlist[idx];
        stopMic();
        initAudio();
        if (audioEl) {
          audioEl.pause();
          audioEl.src = "";
        }
        audioEl = new Audio();
        audioEl.src = track.url;
        audioEl.crossOrigin = "anonymous";
        audioEl.volume = parseFloat(
          document.getElementById("vol-slider").value,
        );
        // Disconnect previous source if any
        if (source) {
          try {
            source.disconnect();
          } catch (e) {}
        }
        source = audioCtx.createMediaElementSource(audioEl);
        source.connect(analyser);
        audioEl.play();
        isPlaying = true;
        updatePlayPauseIcon();
        audioEl.addEventListener("ended", () => {
          if (currentIndex < playlist.length - 1) playIndex(currentIndex + 1);
          else {
            resetUI();
            currentIndex = -1;
            isPlaying = false;
            updatePlayPauseIcon();
            renderPlaylist();
          }
        });
        setActive(true);
        setTrackName(track.name);
        document.getElementById("track-info").classList.add("visible");
        document.getElementById("empty-state").classList.add("hidden");
        setupProgress();
        if (mode === "3d") startThreeDraw();
        else startDraw();
        renderPlaylist();
      }

      function updatePlayPauseIcon() {
        const icon = document.getElementById("pp-icon");
        if (isPlaying) {
          // Pause icon
          icon.innerHTML = `<line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/>`;
        } else {
          // Play icon
          icon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
        }
      }

      // ─── TRANSPORT BUTTONS ───
      document
        .getElementById("play-pause-btn")
        .addEventListener("click", () => {
          if (!audioEl) {
            // Nothing loaded — try playing first in playlist
            if (playlist.length > 0) {
              playIndex(0);
              return;
            }
            return;
          }
          if (isPlaying) {
            audioEl.pause();
            isPlaying = false;
          } else {
            audioEl.play();
            isPlaying = true;
          }
          updatePlayPauseIcon();
        });

      document.getElementById("stop-btn").addEventListener("click", () => {
        if (audioEl) {
          audioEl.pause();
          audioEl.currentTime = 0;
        }
        isPlaying = false;
        updatePlayPauseIcon();
        setActive(false);
        document.getElementById("progress-bar").style.width = "0%";
        document.getElementById("time-current").textContent = "0:00";
      });

      document.getElementById("prev-btn").addEventListener("click", () => {
        if (playlist.length > 0) {
          const target =
            currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
          playIndex(target);
        }
      });

      document.getElementById("next-btn").addEventListener("click", () => {
        if (playlist.length > 0) {
          const target =
            currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
          playIndex(target);
        }
      });

      // ─── PLAYLIST PANEL ───
      document
        .getElementById("playlist-toggle-btn")
        .addEventListener("click", () => {
          document.getElementById("playlist-panel").classList.toggle("open");
        });
      document
        .getElementById("playlist-close-btn")
        .addEventListener("click", () => {
          document.getElementById("playlist-panel").classList.remove("open");
        });
      document
        .getElementById("playlist-file-input")
        .addEventListener("change", (e) => {
          Array.from(e.target.files).forEach((f) => addToPlaylist(f));
          e.target.value = "";
          if (!isActive && playlist.length > 0) playIndex(0);
        });
      document.getElementById("pl-clear-btn").addEventListener("click", () => {
        if (audioEl) {
          audioEl.pause();
          audioEl.src = "";
        }
        const toRevoke = playlist.map((t) => t.url);
        playlist = [];
        currentIndex = -1;
        isPlaying = false;
        updatePlayPauseIcon();
        resetUI();
        renderPlaylist();
        setTimeout(() => toRevoke.forEach((u) => URL.revokeObjectURL(u)), 5000);
      });

      // Playlist drag-and-drop from outside into panel
      const plDropZone = document.getElementById("playlist-drop-zone");
      plDropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.stopPropagation();
        plDropZone.style.background = "rgba(0,255,224,0.04)";
      });
      plDropZone.addEventListener("dragleave", () => {
        plDropZone.style.background = "";
      });
      plDropZone.addEventListener("drop", (e) => {
        plDropZone.style.background = "";
        if (!e.dataTransfer.files.length) return; // internal reorder handled by items
        e.preventDefault();
        e.stopPropagation();
        const files = Array.from(e.dataTransfer.files).filter((f) =>
          f.type.startsWith("audio/"),
        );
        const wasEmpty = playlist.length === 0;
        files.forEach((f) => addToPlaylist(f));
        if (wasEmpty && playlist.length > 0) playIndex(0);
      });

      // ─── SINGLE FILE INPUT (original) ─── hook it into playlist too
      document.getElementById("file-input").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        addToPlaylist(f);
        if (!isActive) playIndex(playlist.length - 1);
        e.target.value = "";
      });

      let fsActive = false;
      document.getElementById("fs-btn").addEventListener("click", toggleFS);
      document.addEventListener("keydown", (e) => {
        if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey)
          toggleFS();
      });
      document.addEventListener("fullscreenchange", () => {
        fsActive = !!document.fullscreenElement;
        document.body.classList.toggle("fullscreen", fsActive);
        if (!fsActive) {
          clearTimeout(hideControlsTimer);
          document.body.classList.remove("controls-visible");
        }
        const btn = document.getElementById("fs-btn");
        btn.innerHTML = fsActive
          ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg> SALIR`
          : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> PANTALLA COMPLETA`;
        setTimeout(resize, 120);
      });
      function toggleFS() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      // ─── FULLSCREEN AUTO-HIDE CONTROLS ───
      let hideControlsTimer = null;
      function showFSControls() {
        if (!fsActive) return;
        document.body.classList.add("controls-visible");
        clearTimeout(hideControlsTimer);
        hideControlsTimer = setTimeout(() => {
          document.body.classList.remove("controls-visible");
        }, 2500);
      }
      document.addEventListener("mousemove", () => {
        if (fsActive) showFSControls();
      });
      document.getElementById("controls").addEventListener("mouseenter", () => {
        if (fsActive) {
          clearTimeout(hideControlsTimer);
          document.body.classList.add("controls-visible");
        }
      });
      document.getElementById("controls").addEventListener("mouseleave", () => {
        if (fsActive) showFSControls();
      });

      function setTrackName(name) {
        document.getElementById("track-name").textContent = name;
      }
      function punchTitle(bass) {
        const target = 1 + bass * 0.14;
        titleBounce += (target - titleBounce) * 0.22;
        const el = document.getElementById("track-name");
        el.style.transform = `scale(${titleBounce})`;
        el.style.textShadow = `0 0 ${18 + bass * 55}px rgba(${hexToRgbStr(colorScheme.a)},${0.35 + bass * 0.55})`;
      }

      // ─── BEAT FLASH ───
      let flashTO;
      function triggerFlash(bass) {
        const rgb = hexToRgbStr(colorScheme.a);
        flashEl.style.background = `radial-gradient(ellipse at center, rgba(${rgb},${Math.min(bass * 0.3, 0.3)}) 0%, transparent 68%)`;
        flashEl.classList.add("pop");
        clearTimeout(flashTO);
        flashTO = setTimeout(() => flashEl.classList.remove("pop"), 90);
      }

      // ═══════════════════════════════════════════════
      //  2D DRAW
      // ═══════════════════════════════════════════════
      class Particle {
        constructor(x, y, vx, vy, sz, col, life) {
          Object.assign(this, { x, y, vx, vy, sz, col, life, ml: life });
        }
        step() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.05;
          this.vx *= 0.97;
          this.life--;
        }
        draw(c) {
          const a = this.life / this.ml;
          c.save();
          c.globalAlpha = a * 0.7;
          c.fillStyle = this.col;
          c.shadowColor = this.col;
          c.shadowBlur = 8;
          c.beginPath();
          c.arc(this.x, this.y, this.sz * a, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }
      }
      function spawnP(x, y, energy, col) {
        if (particles.length > 120) return;
        for (let i = 0; i < Math.floor(energy * 5); i++) {
          const a = Math.random() * Math.PI * 2,
            sp = 1 + Math.random() * energy * 4;
          particles.push(
            new Particle(
              x,
              y,
              Math.cos(a) * sp,
              Math.sin(a) * sp - 1.5,
              1 + Math.random() * 2.5,
              col,
              28 + Math.floor(Math.random() * 28),
            ),
          );
        }
      }

      function startDraw() {
        if (animId) cancelAnimationFrame(animId);
        frame2D();
      }

      function frame2D() {
        animId = requestAnimationFrame(frame2D);
        if (!analyser) return;
        analyser.getByteFrequencyData(dataArray);
        const W = canvas.width,
          H = canvas.height;

        let sum = 0;
        for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
        const avg = sum / bufferLength / 255;

        let bassSum = 0;
        for (let i = 0; i < 10; i++) bassSum += dataArray[i];
        const bass = bassSum / 10 / 255;
        beatEnergy += (bass - beatEnergy) * 0.15;

        const now = performance.now();
        if (bass > 0.52 && now - lastBeat > 270) {
          lastBeat = now;
          bpmSamples.push(now);
          if (bpmSamples.length > 8) bpmSamples.shift();
          if (bpmSamples.length > 1) {
            const iv =
              bpmSamples
                .slice(1)
                .reduce((a, b, i) => a + (b - bpmSamples[i]), 0) /
              (bpmSamples.length - 1);
            document.getElementById("bpm-readout").textContent =
              Math.round(60000 / iv) + " BPM";
          }
          spawnP(W / 2, H / 2, bass, colorScheme.a);
          triggerFlash(bass);
        }

        punchTitle(beatEnergy);

        let pi = 0,
          pv = 0;
        for (let i = 0; i < bufferLength; i++)
          if (dataArray[i] > pv) {
            pv = dataArray[i];
            pi = i;
          }
        document.getElementById("freq-readout").textContent =
          Math.round(pi * (audioCtx.sampleRate / analyser.fftSize)) + " Hz";

        ctx.fillStyle = colorScheme.bg;
        ctx.globalAlpha = 0.28;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;

        particles = particles.filter((p) => p.life > 0);
        particles.forEach((p) => {
          p.step();
          p.draw(ctx);
        });

        if (mode === "bars") drawBars(W, H, bass);
        if (mode === "wave") drawWave(W, H);
        if (mode === "radial") {
          drawRadial(W, H);
          drawRing(W, H, avg, bass);
        }
        if (mode === "tunnel") {
          drawTunnel(W, H);
          drawRing(W, H, avg, bass);
        }
      }

      function drawBars(W, H, bass) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, H / 2);
        ctx.lineTo(W, H / 2);
        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        const count = Math.min(bufferLength, 128),
          barW = (W / count) * 0.7,
          gap = (W / count) * 0.3,
          maxH = H * 0.68;
        for (let i = 0; i < count; i++) {
          const v = dataArray[i] / 255,
            bH = v * maxH,
            x = i * (barW + gap) + gap / 2;
          const gr = ctx.createLinearGradient(
            x,
            H / 2 + bH / 2,
            x,
            H / 2 - bH / 2,
          );
          gr.addColorStop(0, colorScheme.b);
          gr.addColorStop(0.5, colorScheme.a);
          gr.addColorStop(1, colorScheme.c);
          ctx.save();
          ctx.shadowColor = colorScheme.a;
          ctx.shadowBlur = 8 + v * 18;
          ctx.fillStyle = gr;
          ctx.globalAlpha = 0.82 + v * 0.18;
          rr(ctx, x, H / 2 - bH / 2, barW, bH, 2);
          ctx.fill();
          ctx.globalAlpha = 0.15;
          ctx.scale(1, -1);
          ctx.translate(0, -H);
          rr(ctx, x, H - (H / 2 - bH / 2) - bH * 0.35, barW, bH * 0.35, 2);
          ctx.fill();
          ctx.restore();
          if (v > 0.02) {
            ctx.save();
            ctx.fillStyle = colorScheme.c;
            ctx.shadowColor = colorScheme.c;
            ctx.shadowBlur = 8;
            ctx.globalAlpha = v;
            ctx.beginPath();
            ctx.arc(x + barW / 2, H / 2 - bH / 2 - 4, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      function drawWave(W, H) {
        analyser.getByteTimeDomainData(dataArray);
        const sw = W / bufferLength;
        [
          { alpha: 0.6, yo: 0, col: colorScheme.a, lw: 2 },
          { alpha: 0.22, yo: -H * 0.07, col: colorScheme.b, lw: 1 },
          { alpha: 0.14, yo: H * 0.07, col: colorScheme.c, lw: 1 },
        ].forEach((l) => {
          ctx.save();
          ctx.beginPath();
          ctx.strokeStyle = l.col;
          ctx.lineWidth = l.lw;
          ctx.shadowColor = l.col;
          ctx.shadowBlur = 12;
          ctx.globalAlpha = l.alpha;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128 - 1,
              y = H / 2 + v * H * 0.35 + l.yo;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            x += sw;
          }
          ctx.stroke();
          ctx.restore();
        });
        ctx.save();
        ctx.beginPath();
        let x2 = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128 - 1,
            y = H / 2 + v * H * 0.35;
          i === 0 ? ctx.moveTo(x2, y) : ctx.lineTo(x2, y);
          x2 += sw;
        }
        ctx.lineTo(W, H / 2);
        ctx.lineTo(0, H / 2);
        const fg = ctx.createLinearGradient(0, 0, 0, H);
        fg.addColorStop(0, colorScheme.a + "18");
        fg.addColorStop(1, "transparent");
        ctx.fillStyle = fg;
        ctx.fill();
        ctx.restore();
      }

      function drawRadial(W, H) {
        const cx = W / 2,
          cy = H / 2,
          cnt = Math.min(bufferLength, 180),
          baseR = Math.min(W, H) * 0.18,
          maxR = Math.min(W, H) * 0.44;
        for (let i = 0; i < cnt; i++) {
          const v = dataArray[i] / 255,
            angle = (i / cnt) * Math.PI * 2 - Math.PI / 2,
            r1 = baseR + v * (maxR - baseR);
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(
            cx + Math.cos(angle) * baseR,
            cy + Math.sin(angle) * baseR,
          );
          ctx.lineTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
          ctx.lineWidth = 2 + v * 2;
          ctx.strokeStyle = lerpColor(colorScheme.b, colorScheme.a, v);
          ctx.shadowColor = colorScheme.a;
          ctx.shadowBlur = 5 + v * 14;
          ctx.globalAlpha = 0.7 + v * 0.3;
          ctx.stroke();
          ctx.restore();
        }
      }

      let tunnelAngle = 0;
      function drawTunnel(W, H) {
        const cx = W / 2,
          cy = H / 2;
        tunnelAngle += 0.005 + beatEnergy * 0.02;
        for (let l = 12; l >= 1; l--) {
          const t = l / 12,
            energy = dataArray[Math.floor(t * 60)] / 255,
            size = (1 - t) * Math.min(W, H) * 0.52 + 30,
            sides = 6;
          const rot = tunnelAngle * (l % 2 === 0 ? 1 : -1) + l * 0.3,
            col = l % 2 === 0 ? colorScheme.a : colorScheme.b;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          ctx.beginPath();
          for (let s = 0; s <= sides; s++) {
            const a = (s / sides) * Math.PI * 2,
              r = size + energy * 35;
            s === 0
              ? ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r)
              : ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          ctx.closePath();
          ctx.strokeStyle = col;
          ctx.lineWidth = 1 + energy * 1.5;
          ctx.globalAlpha = 0.13 + energy * 0.44;
          ctx.shadowColor = col;
          ctx.shadowBlur = 9 + energy * 22;
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawRing(W, H, avg, bass) {
        const cx = W / 2,
          cy = H / 2,
          r = 36 + bass * 52;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = colorScheme.a;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.1 + bass * 0.5;
        ctx.shadowColor = colorScheme.a;
        ctx.shadowBlur = 20 + bass * 40;
        ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
        ctx.fillStyle = colorScheme.c;
        ctx.globalAlpha = 0.4 + avg * 0.6;
        ctx.shadowColor = colorScheme.c;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();
      }

      // ═══════════════════════════════════════════════
      //  3D (Three.js)
      // ═══════════════════════════════════════════════
      let th3Inited = false,
        threeTime = 0;
      let mainSphere,
        orbitSpheres = [],
        freqBars = [],
        ringMesh,
        particleSys;

      function initThree() {
        if (th3Inited) return;
        th3Inited = true;

        threeRenderer = new THREE.WebGLRenderer({
          canvas: threeCanvas,
          antialias: true,
          alpha: false,
        });
        threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        threeRenderer.setSize(wrap.clientWidth, wrap.clientHeight);
        threeRenderer.setClearColor(0x020408, 1);
        threeScene = new THREE.Scene();
        threeCamera = new THREE.PerspectiveCamera(
          60,
          wrap.clientWidth / wrap.clientHeight,
          0.1,
          1000,
        );
        threeCamera.position.set(0, 0, 50);

        // Central sphere
        const mat = new THREE.MeshPhongMaterial({
          color: 0x00ffe0,
          emissive: 0x002211,
          shininess: 120,
          specular: 0x00ffcc,
          wireframe: false,
        });
        mainSphere = new THREE.Mesh(new THREE.SphereGeometry(8, 64, 64), mat);
        threeScene.add(mainSphere);

        // Wireframe shell
        const shellMat = new THREE.MeshBasicMaterial({
          color: 0x00ffe0,
          wireframe: true,
          transparent: true,
          opacity: 0.08,
        });
        threeScene.add(
          new THREE.Mesh(new THREE.SphereGeometry(8.3, 32, 32), shellMat),
        );

        // Orbiting spheres
        const orbitC = [
          0xff2d78, 0xffe600, 0x7c3aff, 0x39ff14, 0xff6b00, 0x00c6ff,
        ];
        for (let i = 0; i < 6; i++) {
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(1.4, 20, 20),
            new THREE.MeshPhongMaterial({
              color: orbitC[i],
              emissive: 0x110000,
              shininess: 80,
            }),
          );
          const ang = (i / 6) * Math.PI * 2;
          m.position.set(Math.cos(ang) * 22, Math.sin(ang) * 22, 0);
          threeScene.add(m);
          orbitSpheres.push({
            mesh: m,
            angle: ang,
            radius: 22,
            speed: 0.007 + i * 0.002,
          });
        }

        // Frequency bars in a ring
        const barGroup = new THREE.Group(),
          barCount = 64;
        for (let i = 0; i < barCount; i++) {
          const bg = new THREE.BoxGeometry(0.38, 1, 0.38);
          const bm = new THREE.MeshPhongMaterial({
            color: 0x00ffe0,
            emissive: 0x002210,
          });
          const bar = new THREE.Mesh(bg, bm);
          const ang = (i / barCount) * Math.PI * 2;
          bar.position.set(Math.cos(ang) * 13, Math.sin(ang) * 13, 0);
          bar.rotation.z = ang;
          barGroup.add(bar);
          freqBars.push({ mesh: bar, angle: ang, r: 13 });
        }
        threeScene.add(barGroup);
        freqBars._group = barGroup;

        // Ring torus
        ringMesh = new THREE.Mesh(
          new THREE.TorusGeometry(13.8, 0.12, 8, 128),
          new THREE.MeshBasicMaterial({
            color: 0x00ffe0,
            transparent: true,
            opacity: 0.25,
          }),
        );
        threeScene.add(ringMesh);

        // Particles
        const pN = 1200,
          pPos = new Float32Array(pN * 3);
        for (let i = 0; i < pN * 3; i++) pPos[i] = (Math.random() - 0.5) * 140;
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
        particleSys = new THREE.Points(
          pGeo,
          new THREE.PointsMaterial({
            color: 0x00ffe0,
            size: 0.22,
            transparent: true,
            opacity: 0.55,
          }),
        );
        threeScene.add(particleSys);

        // Lights
        threeScene.add(new THREE.AmbientLight(0x112233, 1.4));
        const pl1 = new THREE.PointLight(0x00ffe0, 3, 140);
        pl1.position.set(20, 20, 25);
        threeScene.add(pl1);
        const pl2 = new THREE.PointLight(0xff2d78, 2.2, 90);
        pl2.position.set(-22, -16, 12);
        threeScene.add(pl2);
      }

      function updateThreeColors() {
        if (!th3Inited) return;
        const c = new THREE.Color(colorScheme.a);
        if (mainSphere) mainSphere.material.color.set(c);
        freqBars.forEach((b) => b.mesh.material.color.set(c));
        if (ringMesh) ringMesh.material.color.set(c);
        if (particleSys) particleSys.material.color.set(c);
      }

      function startThreeDraw() {
        if (threeAnimId) cancelAnimationFrame(threeAnimId);
        frameThree();
      }

      function frameThree() {
        threeAnimId = requestAnimationFrame(frameThree);
        if (!analyser || !th3Inited) return;
        analyser.getByteFrequencyData(dataArray);
        threeTime += 0.016;

        let bassSum = 0;
        for (let i = 0; i < 10; i++) bassSum += dataArray[i];
        const bass = bassSum / 10 / 255;
        let midSum = 0;
        for (let i = 10; i < 80; i++) midSum += dataArray[i];
        const mid = midSum / 70 / 255;

        const now = performance.now();
        if (bass > 0.52 && now - lastBeat > 270) {
          lastBeat = now;
          triggerFlash(bass);
          spawnP(
            wrap.clientWidth / 2,
            wrap.clientHeight / 2,
            bass,
            colorScheme.a,
          );
        }
        punchTitle(bass * 0.85);
        particles = particles.filter((p) => p.life > 0); // keep 2D particles alive even in 3D mode

        // Main sphere
        if (mainSphere) {
          mainSphere.scale.setScalar(1 + bass * 0.65 + mid * 0.18);
          mainSphere.rotation.y += 0.009 + bass * 0.035;
          mainSphere.rotation.x += 0.004;
          mainSphere.material.emissiveIntensity = bass * 0.9;
          mainSphere.material.color.setHex(
            parseInt(colorScheme.a.replace("#", ""), 16),
          );
        }

        // Orbits
        orbitSpheres.forEach((s) => {
          s.angle += s.speed + mid * 0.018;
          s.mesh.position.x = Math.cos(s.angle) * s.radius;
          s.mesh.position.y = Math.sin(s.angle) * s.radius;
          s.mesh.position.z = Math.sin(threeTime * 0.55 + s.angle) * 9;
          s.mesh.scale.setScalar(1 + mid * 1.4);
        });

        // Freq bars
        if (freqBars._group) freqBars._group.rotation.z += 0.006 + bass * 0.018;
        freqBars.forEach((b, i) => {
          const v = dataArray[Math.floor((i / freqBars.length) * 80)] / 255;
          b.mesh.scale.y = 1 + v * 13;
          const hx = parseInt(
            lerpColor(colorScheme.b, colorScheme.a, v).replace("#", ""),
            16,
          );
          b.mesh.material.color.setHex(hx);
          b.mesh.position.x = Math.cos(b.angle) * (b.r + v * 4);
          b.mesh.position.y = Math.sin(b.angle) * (b.r + v * 4);
        });

        // Ring
        if (ringMesh) {
          ringMesh.rotation.z += 0.01;
          ringMesh.rotation.x = Math.sin(threeTime * 0.4) * 0.5;
          ringMesh.material.opacity = 0.15 + bass * 0.55;
          ringMesh.scale.setScalar(1 + bass * 0.25);
        }

        // Particles
        if (particleSys) {
          particleSys.rotation.y += 0.0012 + mid * 0.003;
          particleSys.rotation.x += 0.0006;
          particleSys.material.opacity = 0.28 + mid * 0.5;
          particleSys.material.color.setHex(
            parseInt(colorScheme.a.replace("#", ""), 16),
          );
        }

        threeCamera.position.x = Math.sin(threeTime * 0.09) * 6;
        threeCamera.position.y = Math.cos(threeTime * 0.07) * 4;
        threeCamera.lookAt(0, 0, 0);
        threeRenderer.render(threeScene, threeCamera);
      }

      // ─── UTILS ───
      function rr(c, x, y, w, h, r) {
        if (h < 0) {
          y += h;
          h = -h;
        }
        if (h < r * 2) r = h / 2;
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.arcTo(x + w, y, x + w, y + r, r);
        c.lineTo(x + w, y + h - r);
        c.arcTo(x + w, y + h, x + w - r, y + h, r);
        c.lineTo(x + r, y + h);
        c.arcTo(x, y + h, x, y + h - r, r);
        c.lineTo(x, y + r);
        c.arcTo(x, y, x + r, y, r);
        c.closePath();
      }
      function hexToRgb(h) {
        return [
          parseInt(h.slice(1, 3), 16),
          parseInt(h.slice(3, 5), 16),
          parseInt(h.slice(5, 7), 16),
        ];
      }
      function hexToRgbStr(h) {
        return hexToRgb(h).join(",");
      }
      function lerpColor(c1, c2, t) {
        const [r1, g1, b1] = hexToRgb(c1),
          [r2, g2, b2] = hexToRgb(c2);
        return (
          "#" +
          [r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t]
            .map((v) => Math.round(v).toString(16).padStart(2, "0"))
            .join("")
        );
      }
    </script>
  </body>
