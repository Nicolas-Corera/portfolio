<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"

    <title>Modelo de Bohr 3D · Tabla periódica</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f5f6fa;
        --card: #fff;
        --ink: #14171f;
        --mut: #5d6578;
        --line: #d9dde8;
        --acc: #2b6cff;
        --sel: #14171f;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1118;
          --card: #171b25;
          --ink: #e8ebf3;
          --mut: #98a1b5;
          --line: #2a3040;
          --acc: #6b9bff;
          --sel: #fff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1118;
        --card: #171b25;
        --ink: #e8ebf3;
        --mut: #98a1b5;
        --line: #2a3040;
        --acc: #6b9bff;
        --sel: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.4;
      }
      main {
        max-width: 1560px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 1.1rem;
        margin: 28px 0 10px;
      }
      p.sub {
        color: var(--mut);
        margin: 0 0 16px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .scroll {
        overflow-x: auto;
      }
      #pt {
        display: grid;
        grid-template-columns: 34px repeat(19, minmax(64px, 1fr));
        grid-template-rows: 42px repeat(7, auto) 30px auto auto;
        gap: 4px;
        min-width: 1300px;
      }
      .lb {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        font-weight: 600;
        color: #6b6f9e;
        line-height: 1.1;
      }
      .lb small {
        font-size: 0.68rem;
        font-weight: 500;
        color: #4b86e8;
      }
      .ptp {
        background: #fff;
        border-color: #e6e8ef;
      }
      .ptp .legend {
        color: #5d6578;
      }
      .el {
        position: relative;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid transparent;
        border-radius: 5px;
        padding: 0;
        cursor: pointer;
        font: inherit;
        overflow: hidden;
      }
      .el .n {
        position: absolute;
        top: 5px;
        left: 6px;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .el .s {
        font-size: 2.3rem;
        font-weight: 300;
        line-height: 1;
        margin-top: -8px;
      }
      .el .t {
        position: absolute;
        bottom: 3px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.68rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
      }
      .el:hover {
        filter: saturate(1.6) brightness(0.97);
      }
      .el.on {
        border-color: #14171f;
        box-shadow: 0 0 0 2px #2b6cff;
      }

        font-size: 0.65rem;
        color: var(--mut);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed var(--line);
        border-radius: 6px;

        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 12px;
        font-size: 0.95rem;
        color: var(--mut);
      }

        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }

        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
        min-width: 620px;
      }

      td {
        padding: 8px 10px;
        text-align: center;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        color: var(--mut);
        background: transparent;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      .btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
      }
      .btn:hover {
        border-color: var(--acc);
        color: var(--acc);
      }
      .empty {
        color: var(--mut);
        padding: 18px;
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .card.big {
        grid-column: 1/-1;
      }
      .card canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        cursor: grab;
        background: radial-gradient(circle at 50% 40%, #1b2540, #0a0d15);
      }
      .card.big canvas {
        max-height: 78vh;
        width: auto;
        margin: 0 auto;
      }
      .card canvas:active {
        cursor: grabbing;
      }
      .card canvas {
        touch-action: pan-y;
      }
      .cap {
        padding: 10px 12px;
        font-size: 0.88rem;
      }
      .cap .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .cap code {
        display: block;
        margin-top: 4px;
        font-size: 0.85rem;
        color: var(--mut);
        word-break: break-word;
      }
      .k {
        display: inline-flex;
        gap: 10px;
        font-size: 0.78rem;
        color: var(--mut);
        margin: 0 0 10px;
        flex-wrap: wrap;
      }
      .k i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .ztb {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: #5d6578;
      }
      .ztb .btn {
        background: #fff;
        color: #14171f;
        border-color: #d9dde8;
        min-width: 40px;
        font-size: 1.05rem;
      }
      @media (max-width: 720px) {
        main {
          padding: 14px 10px 50px;
        }
        h1 {
          font-size: 1.25rem;
        }
        #pt {
          grid-template-columns: 24px repeat(19, minmax(44px, 1fr));
          grid-template-rows: 34px repeat(7, auto) 20px auto auto;
          gap: 3px;
          min-width: 900px;
        }
        .el .t {
          display: none;
        }
        .el .s {
          font-size: 1.4rem;
          margin-top: -2px;
        }
        .el .n {
          font-size: 0.62rem;
          top: 3px;
          left: 4px;
        }
        .lb {
          font-size: 0.85rem;
        }
        .lb small {
          font-size: 0.5rem;
        }
        .legend {
          font-size: 0.78rem;
        }
        th,
        td {
          padding: 7px 8px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .btn {
          padding: 8px 12px;
        }
      }
    </style>
  </head>

        var renderer = new THREE.WebGLRenderer({
          alpha: true,

        var sphereGeo = new THREE.SphereGeometry(1, 16, 12);

        function buildAtom(e) {

          scene.add(new THREE.AmbientLight(0xffffff, 0.65));

            c = new THREE.Color(),

              title=${e.name}
              style=${{
                gridRow: row,
                gridColumn: col,
                background: CATS[cat(e)][1],
                color: CATS[cat(e)][2],
              }}
              onClick=${function () {
                toggle(e.Z);
              }}
            >
              <span class="n">${e.Z}</span><span class="s">${e.sym}</span
              ><span class="t">${e.name}</span>
            </button>`;
          });
          return html`<main>
            <h1>Modelo atómico de Bohr en 3D</h1>
            <p class="sub">
              Tocá elementos de la tabla periódica para sumarlos a la tabla de
              datos y ver su átomo renderizado abajo.
            </p>
            <div class="panel ptp">
              <div class="ztb">
                <span>Zoom ${Math.round(zoom * 100)}%</span
                ><button
                  class="btn"
                  onClick=${function () {
                    setZoom(Math.max(0.6, +(zoom - 0.2).toFixed(1)));
                  }}
                >
                  −</button
                ><button
                  class="btn"
                  onClick=${function () {
                    setZoom(Math.min(1.8, +(zoom + 0.2).toFixed(1)));
                  }}
                >
                  +
                </button>
              </div>
              <div class="scroll">
                <div id="pt" style=${{ zoom: zoom }}>
                  ${cells}
                  ${Array.from({ length: 18 }, function (_, i) {
                    var g = i + 1,
                      sub = {
                        15: "Pnictógenos",
                        16: "Anfígenos",
                        17: "Halógenos",
                      }[g];
                    return html`<div
                      key=${"g" + g}
                      class="lb"
                      style=${{
                        gridRow: 1,
                        gridColumn: (g >= 4 ? g + 1 : g) + 1,
                      }}
                    >
                      ${g}${sub ? html`<small>${sub}</small>` : null}
                    </div>`;
                  })}
                  ${[1, 2, 3, 4, 5, 6, 7].map(function (p) {
                    return html`<div
                      key=${"p" + p}
                      class="lb"
                      style=${{ gridRow: p + 1, gridColumn: 1 }}
                    >
                      ${p}
                    </div>`;
                  })}
                  ${[6, 7].map(function (p) {
                    return html`<div
                      key=${"pf" + p}
                      class="lb"
                      style=${{ gridRow: p + 4, gridColumn: 1 }}
                    >
                      ${p}
                    </div>`;
                  })}
                </div>
              </div>
              <div class="legend">
                ${CATS.map(function (c) {
                  return html`<span key=${c[0]}
                    ><i style=${{ background: c[2] }}></i>${c[0]}</span
                  >`;
                })}
              </div>
            </div>

            <h2>
              Tabla de elementos seleccionados
              ${sel.length
                ? html`<button
                    class="btn"
                    style=${{ marginLeft: 8 }}
                    onClick=${function () {
                      setSel([]);
                      setBig(null);
                    }}
                  >
                    Vaciar
                  </button>`
                : null}
            </h2>
            <div class="panel scroll">
              ${rows.length === 0
                ? html`<div class="empty">
                    Todavía no elegiste ningún elemento.
                  </div>`
                : html` <table>
                    <thead>
                      <tr>
                        ${[
                          "ELEMENTO",
                          "SÍMBOLO",
                          "A",
                          "Z",
                          "p+",
                          "e-",
                          "N",
                          "PERIODO",
                          "GRUPO",
                          "",
                        ].map(function (h, i) {
                          return html`<th key=${i}>${h}</th>`;
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      ${rows.map(function (e) {
                        return html`<tr key=${e.Z}>
                          <td><b>${e.name.toUpperCase()}</b></td>
                          <td>${e.sym.toUpperCase()}</td>
                          <td>${e.A}</td>
                          <td>${e.Z}</td>
                          <td>${e.Z}</td>
                          <td>${e.Z}</td>
                          <td>${e.N}</td>
                          <td>${e.per}</td>
                          <td>${e.g}</td>
                          <td>
                            <button
                              class="btn"
                              onClick=${function () {
                                toggle(e.Z);
                              }}
                            >
                              ×
                            </button>
                          </td>
                        </tr>`;
                      })}
                    </tbody>
                  </table>`}
            </div>

            <h2>Modelo de Bohr</h2>
            <div class="k">
              <span
                ><i style=${{ background: "#e5484d" }}></i>protones (p+)</span
              ><span
                ><i style=${{ background: "#9aa4b2" }}></i>neutrones (N)</span
              ><span
                ><i style=${{ background: "#2f7bff" }}></i>electrones (e-)</span
              ><span>Arrastrá para rotar · rueda para zoom</span>
            </div>
            ${rows.length === 0
              ? html`<div class="panel empty">
                  Los modelos aparecen acá a medida que sumás elementos.
                </div>`
              : html`<div class="grid">
                  ${rows.map(function (e) {
                    return html`<${Card}
                      key=${e.Z}
                      e=${e}
                      big=${big === e.Z}
                      onBig=${function () {
                        setBig(big === e.Z ? null : e.Z);
                      }}
                      onRemove=${function () {
                        toggle(e.Z);
                      }}
                    />`;
                  })}
                </div>`}
            <p class="sub" style=${{ marginTop: 20, fontSize: ".8rem" }}>
              Capas con el llenado clásico 2n² (2, 8, 18, 32…), por eso el Ca
              queda 2-8-10. A = número másico (isótopo más común o más estable);
              N = A − Z. Lantánidos y actínidos figuran en el grupo 3.
            </p>
          </main>`;
        }
        ReactDOM.createRoot(document.getElementById("root")).render(
          React.createElement(App),
        );
      })();
    </script>
  </body>
</html>
